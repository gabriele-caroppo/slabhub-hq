.ig-user{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.ig-user button{height:26px;padding:0 10px;border:1px solid #fff;border-radius:7px;color:#fff;font-size:12.5px;font-weight:600;background:transparent}
.ig-rbottom p{font-size:13px;line-height:1.3;max-height:2.6em;overflow:hidden}
.ig-audio{display:flex;align-items:center;gap:6px;font-size:12px}
.ig-audio svg{width:12px;height:12px}
.screen.zones .ig-rbottom,.screen.zones .ig-rail{opacity:.5}
/* instagram story */
.st-bars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px}
.st-bars i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.35)}
.st-bars i.full{background:#fff}.st-bars i.cur{background:linear-gradient(90deg,#fff 60%,rgba(255,255,255,.35) 60%)}
.st-head{position:absolute;top:18px;left:10px;right:10px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.st-head small{color:rgba(255,255,255,.8);font-weight:400}
.st-x{margin-left:auto;display:flex;gap:10px}.st-x svg{width:22px;height:22px}
.st-foot{position:absolute;left:10px;right:10px;bottom:14px;display:flex;align-items:center;gap:12px}
.st-reply{flex:1;height:42px;border:1px solid rgba(255,255,255,.7);border-radius:999px;display:flex;align-items:center;padding:0 16px;font-size:14px;color:rgba(255,255,255,.85)}
.st-foot i svg{width:26px;height:26px}
/* instagram feed */
.soc-feed{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;background:#000;position:relative}
.ig-top{display:flex;align-items:center;gap:18px;padding:6px 14px 10px}
.ig-logo{flex:1;font:italic 700 24px/1 "Brush Script MT","Snell Roundhand",cursive;letter-spacing:.01em}
.ig-top i svg{width:24px;height:24px}
.ig-ph{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.ig-ph i{margin-left:auto}.ig-ph svg{width:20px;height:20px}
.ig-pm{position:relative;width:100%;aspect-ratio:4/5;background:#111;overflow:hidden}
.ig-pm.sq{aspect-ratio:1/1}
.ig-pm.fake{background:linear-gradient(135deg,#1c2430,#0f141c)}
.ig-count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600}
.ig-acts{display:flex;align-items:center;gap:14px;padding:10px 12px 6px;position:relative}
.ig-acts svg{width:25px;height:25px}
.ig-acts .r{margin-left:auto}
.ig-dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}.ig-dots i.on{background:#3797f0}
.ig-likes{padding:0 12px;font-size:13.5px;font-weight:600}
.ig-cap{padding:4px 12px 0;font-size:13.5px;line-height:1.35}
.ig-cap .more{color:#a8a8a8}
.ig-comm,.ig-time{padding:3px 12px 0;font-size:13px;color:#a8a8a8}
.ig-time{font-size:11px;padding-bottom:10px}
.ig-next{opacity:.9}
/* tiktok */
.tk .soc-ui{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 16%,transparent 60%,rgba(0,0,0,.55))}
.tk-top{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:20px;font-size:16px;font-weight:600;color:rgba(255,255,255,.7);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.tk-top .on{color:#fff;position:relative}
.tk-top .on::after{content:"";position:absolute;left:25%;right:25%;bottom:-6px;height:2px;background:#fff;border-radius:2px}
.tk-search{position:absolute;right:14px;top:0}.tk-search svg{width:24px;height:24px}
.tk-rail{position:absolute;right:8px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.tk-rail span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.tk-rail svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tk-avatar{position:relative;width:44px;height:44px;border-radius:50%;background:#333;border:1.5px solid #fff;overflow:visible;margin-bottom:6px}
.tk-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tk-avatar i{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#fe2c55;color:#fff;font:700 16px/20px Inter;text-align:center;font-style:normal}
.tk-disc{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#333 0 30%,#111 31% 100%);display:flex;align-items:center;justify-content:center;animation:spin 4s linear infinite}
.tk-disc i{width:22px;height:22px;border-radius:50%;overflow:hidden;background:#555;display:block}
.tk-disc i img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.tk-bottom{position:absolute;left:12px;right:70px;bottom:14px;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tk-bottom b{font-size:15px;font-weight:700}
.tk-bottom p{font-size:13.5px;line-height:1.3}
.tk-sound{display:flex;align-items:center;gap:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.tk-sound svg{width:14px;height:14px;flex:none}
.tk-sound span{overflow:hidden;flex:1}.tk-sound em{display:inline-block;font-style:normal;animation:ticker 10s linear infinite}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-nav{height:60px;padding-bottom:4px}
.tk-nav span{opacity:.6}.tk-nav span.on{opacity:1}
.tk-nav small{font-size:10px}
.tk-plus{width:46px;height:30px;position:relative;opacity:1!important}
.tk-plus i{position:absolute;inset:0;background:#fff;border-radius:9px;box-shadow:-5px 0 0 #25f4ee,5px 0 0 #fe2c55}
.tk-plus i::after{content:"+";position:absolute;inset:0;color:#000;font:700 22px/30px Inter;text-align:center}
@media (max-height:720px){.phone{border-radius:32px;border-width:6px}.phone::before{display:none}}

/* ===================== DASHBOARD ===================== */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpis.two{grid-template-columns:1fr 1fr}
.kpi{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px;min-width:0}
.kpi b{display:block;font:900 22px/1 var(--sp);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{display:block;font-size:11.5px;color:var(--faint);margin-top:5px}
.kpi small{display:block;font-size:11px;color:var(--faint);margin-top:4px}
.delta.up{color:var(--ok)}.delta.down{color:var(--no)}
.chart-wrap{overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:6px 4px 2px}
.chart-wrap::-webkit-scrollbar{display:none}
.chart{display:block;overflow:visible;width:max(100%,calc(var(--n,6) * 72px));height:auto}
.chart text{font:600 11px Inter;fill:var(--faint)}
.chart text.val{font:700 10.5px Inter;fill:var(--text)}
.chart text.lab.cur{fill:var(--text);font-weight:800}
.chart rect{transform-box:fill-box;transform-origin:bottom;animation:growy .9s var(--spring) both;animation-delay:var(--d,0ms);opacity:.85}
.chart rect.cur,.chart circle.cur{opacity:1;filter:drop-shadow(0 0 6px var(--accent))}
@keyframes growy{from{transform:scaleY(0)}}
.chart.line .ln{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
@media (max-width:899px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:19px}.chart text{font-size:14px}.chart text.val{font-size:13px}}

/* ===================== DELIGHT: micro-animazioni e feste ===================== */
.toast{display:flex;align-items:center;gap:8px;font-weight:500}
.toast svg{width:14px;height:14px;flex:none}
.toast.ok{border-color:var(--ok-border);color:var(--text)}.toast.ok svg{color:var(--ok)}
.toast.undo{color:var(--muted)}.toast.undo svg{color:var(--muted)}
.toast.warn{border-color:var(--no-border);background:var(--no-bg)}
.btn:active,.pill:active,.fbtn:active,.chip.act:active,.seg button:active,.opts button:active,.tri button:active,.plus:active,.ct-t:active,.stepper button:active,.block-arr:active{transform:scale(.95)}
.plus:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(26,140,255,.35)}
.plus.sm:hover{box-shadow:0 6px 16px rgba(26,140,255,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.opts button.on{animation:selpop .35s var(--spring)}
@keyframes selpop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.tdone.on{animation:pop2 .45s cubic-bezier(.3,1.6,.5,1)}
.tcard.done{animation:donesweep .9s ease-out}
@keyframes donesweep{0%{box-shadow:inset 0 0 0 0 rgba(46,191,140,.0)}30%{box-shadow:inset 0 0 0 2px rgba(46,191,140,.55)}100%{box-shadow:inset 0 0 0 0 rgba(46,191,140,0)}}
.req[data-st="yes"] .step{animation:pop2 .45s cubic-bezier(.3,1.6,.5,1)}
.plan-hint.ok{animation:fadein .5s both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.block{animation:blockin .5s var(--spring) both}
.blocks .block:nth-child(2){animation-delay:.05s}.blocks .block:nth-child(3){animation-delay:.1s}.blocks .block:nth-child(4){animation-delay:.15s}.blocks .block:nth-child(5){animation-delay:.2s}.blocks .block:nth-child(6){animation-delay:.25s}
@keyframes blockin{from{opacity:0;transform:translateY(10px)}}
.hello{align-items:center}
.today-chip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font:700 10.5px/1 var(--sp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:none}
.today-chip svg{width:12px;height:12px}
.today-chip.ok{color:var(--ok);border-color:var(--ok-border);background:var(--ok-bg)}
.today-chip.warn{color:var(--no);border-color:var(--no-border);background:var(--no-bg)}
.cheer{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.cheer.in{opacity:1}
.cheer-box{pointer-events:auto;background:var(--card-2);border:1px solid var(--ok-border);border-radius:26px;padding:26px 30px;text-align:center;max-width:min(86vw,420px);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(46,191,140,.15);transform:scale(.8) translateY(10px);transition:transform .5s var(--spring)}
.cheer.in .cheer-box{transform:none}
.cheer-ic{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--ok);color:#06251A;margin-bottom:12px;animation:pop2 .6s cubic-bezier(.3,1.6,.5,1) .1s both}
.cheer-ic svg{width:28px;height:28px}
.cheer-box strong{display:block;font:900 26px/1.05 var(--sp);letter-spacing:-.02em;text-transform:uppercase}
.cheer-box small{display:block;font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.cheer.gold .cheer-box{border-color:rgba(230,180,90,.6)}.cheer.gold .cheer-ic{background:var(--doing);color:#2A1D05}
.cheer.ready .cheer-box{border-color:var(--accent)}.cheer.ready .cheer-ic{background:var(--grad);color:#fff}
@media (prefers-reduced-motion:reduce){.block,.opts button.on,.tdone.on,.tcard.done,.req .step{animation:none}}

/* ===================== CORNER CONCENTRICITY =====================
   Regola: raggio interno = raggio esterno − (bordo + padding), minimo 8px.
   Tre livelli: --r1 contenitore, --r2 card, --r3 elementi dentro la card.
   Dove il padding supera il raggio si alza l'esterno (blocco corsie 34, scheda 34)
   invece di schiacciare l'interno.
   ================================================================ */
:root{--r2:16px;--r3:12px}
.block{--r1:28px;--r2:max(8px,calc(var(--r1) - 12px));border-radius:var(--r1);padding:6px 6px 7px}
.block-b{padding:0 5px 5px}
.block:has(> .block-b > .lanes),.block.lanes-block{--r1:34px}
.item,.tile,.mstat,.kpi,.chart-wrap,.req,.plan-row,.empty-note,.rcard,.cal,.lane{border-radius:var(--r2)}
.lane{--r3:max(8px,calc(var(--r2) - 7px));padding:6px 6px 8px}
.lane .lane-h{padding:8px 8px 6px}
.tcard{border-radius:var(--r3)}
.tile{--r3:max(8px,calc(var(--r2) - 11px))}
.tile .thumb{border-radius:var(--r3)}
.req{--r3:max(8px,calc(var(--r2) - 13px))}
.ct-box{border-radius:var(--r3)}
.plan-row{--r3:max(8px,calc(var(--r2) - 13px))}
.plan-row .pth{border-radius:var(--r3)}
.cal{--r3:max(8px,calc(var(--r2) - 11px))}
.cal .cal-d{border-radius:var(--r3)}
.sheet{--r1:34px;--r2:max(8px,calc(var(--r1) - 21px));border-radius:var(--r1) var(--r1) 0 0}
@media (min-width:900px){.sheet{border-radius:var(--r1)}}
.f input,.f select,.f textarea,.sub-row,.att-item,.att-add,.media-add,.pth.lg,.more-f,.csec,.lb-pdf{border-radius:var(--r2)}
.more-f,.csec{--r3:max(8px,calc(var(--r2) - 15px))}
.more-f .f input,.more-f .f select,.more-f .f textarea,.csec .f input,.csec .f select,.csec .f textarea{border-radius:var(--r3)}
.att-item{--r3:max(8px,calc(var(--r2) - 7px))}
.att-item .att{border-radius:var(--r3)}
.tdock{--r1:28px;--r2:max(8px,calc(var(--r1) - 13px));border-radius:var(--r1)}
.tdock-t{border-radius:var(--r2)}
.cheer-box{border-radius:28px}
.screen{border-radius:36px;overflow:hidden}
.ig-pm,.lb-img{border-radius:0}
.pnote{border-radius:4px 4px 10px 4px}
.bnav button{border-radius:999px}

/* ===================== GIRO 3: Oggi, ricerca, azioni rapide, novità, tab ===================== */
.sec-lab{font:700 10.5px/1 var(--sp);letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin:22px 4px 2px}
.block.today{border-color:rgba(26,140,255,.35)}
.tgrp{margin-bottom:6px}
.tgrp h4{display:flex;align-items:center;gap:8px;font:800 10.5px/1 var(--sp);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:10px 8px 8px}
.tgrp h4 span{font:700 10px/1 Inter;color:var(--faint);background:var(--card-2);border-radius:999px;padding:3px 7px}
.tgrp.late h4{color:var(--no)}.tgrp.now h4{color:var(--text)}.tgrp.post h4{color:var(--accent-2)}.tgrp.almost h4{color:var(--ok)}
.tgrp .tcard,.tgrp .item{margin-bottom:6px}
.empty-g{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 18px;border:1px dashed var(--line);border-radius:var(--r2)}
.empty-ic{width:44px;height:44px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.empty-ic svg{width:20px;height:20px}
.empty-g p{font-size:13.5px;color:var(--muted);max-width:320px;line-height:1.45}
.block.news{border-color:var(--ok-border);background:linear-gradient(180deg,rgba(46,191,140,.07),transparent 60%),var(--surface)}
.news-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);padding:4px 8px 10px}
.news-who b{color:var(--text)}
.news-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-top:1px solid var(--line-soft);font-size:13.5px}
.news-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news-row small{color:var(--faint);flex:none}
.news-row .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.news-row .dot.ok{background:var(--ok)}.news-row .dot.no{background:var(--no)}
.block.news .link-btn{margin:8px 8px 4px}
.nextstep{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:10px 0 0;border-radius:var(--r2);background:var(--doing-bg);border:1px solid var(--doing-border);font-size:13.5px}
.nextstep span{flex:1;min-width:0}
.nextstep.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
.nextstep.ok svg{width:16px;height:16px}
.nextstep.no{background:var(--no-bg);border-color:var(--no-border)}
.nextstep .pill.sm{height:34px;padding:0 12px;gap:5px;border-color:var(--ok-border);color:var(--ok)}
.nextstep .pill.sm svg{width:13px;height:13px}
.ring{width:26px;height:26px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p) * 1%),var(--track) 0);-webkit-mask:radial-gradient(circle,transparent 7px,#000 8px);mask:radial-gradient(circle,transparent 7px,#000 8px)}
.ctabs{width:100%}.ctabs button{flex:1}
.ftabs.small{margin-bottom:10px}
.almost-it .chip{flex:none}
/* ricerca */
.gs-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);margin-right:8px;font-size:13px}
.gs-btn svg{width:17px;height:17px}
.gs-btn span,.gs-btn kbd{display:none}
.gs-btn kbd{font:600 10.5px/1 Inter;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:3px 5px}
@media (min-width:900px){.gs-btn{width:240px;justify-content:flex-start;padding:0 12px}.gs-btn span{display:inline;flex:1;text-align:left}.gs-btn kbd{display:inline}}
.gsearch{position:fixed;inset:0;z-index:520;background:rgba(2,5,9,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-start;justify-content:center;padding:calc(14px + var(--safe-t)) 12px 12px;opacity:0;transition:opacity .18s}
.gsearch.in{opacity:1}
.gs-box{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;transform:translateY(-8px);transition:transform .25s var(--spring)}
.gsearch.in .gs-box{transform:none}
.gs-in{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line-soft)}
.gs-in>svg{width:20px;height:20px;color:var(--muted);flex:none}
.gs-in input{flex:1;height:44px;border:0;background:transparent;color:var(--text);font-size:17px;outline:0;min-width:0}
.gs-in input::-webkit-search-cancel-button{display:none}
.gs-in .btn.icon{width:40px;height:40px;font-size:22px}
.gs-res{max-height:min(66vh,560px);overflow:auto;padding:6px 8px 10px}
.gs-res h5{font:800 10px/1 var(--sp);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.gs-it{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:12px;text-align:left;color:var(--text)}
.gs-it:hover,.gs-it.sel{background:var(--card-2)}
.gs-it>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gs-it b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-it small{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-it>svg{width:14px;height:14px;color:var(--faint);flex:none}
.gs-it>svg:first-child{width:16px;height:16px;color:var(--muted)}
.gs-ic{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.gs-ic svg{width:16px;height:16px}
.gs-it .thumb.xs{width:34px}
.gs-more{display:block;padding:2px 10px 6px;color:var(--faint);font-size:12px}
.gs-hint{padding:10px}
.gs-hint p{font-size:13.5px;color:var(--muted);text-align:center;padding:16px 10px}
/* azioni rapide */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:76px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line-soft);color:var(--text);font:700 11px/1 var(--sp);letter-spacing:.06em;text-transform:uppercase}
.qa svg{width:20px;height:20px}
.qa.ok{border-color:var(--ok-border);color:var(--ok)}
.qa.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qa.danger{color:var(--no);border-color:var(--no-border)}
.qa:disabled{opacity:.5}
.qa-status{margin-bottom:0}
.qmove{margin-top:8px}

/* ===================== LOGIN: animazione rifatta ===================== */
.gate{overflow:hidden;background:var(--bg)}
.g-aur{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none;will-change:transform}
.g-aur.a{left:-20vmax;top:-30vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 65%);animation:aurA 22s ease-in-out infinite alternate}
.g-aur.b{right:-25vmax;bottom:-35vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 65%);animation:aurB 28s ease-in-out infinite alternate}
@keyframes aurA{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes aurB{to{transform:translate(-16vmax,-10vmax) scale(1.1)}}
.gate::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 40%,transparent 40%,rgba(0,0,0,.45));pointer-events:none}
.g-in{position:relative;z-index:1}
.g-logo{animation:glogo 1.1s cubic-bezier(.2,.8,.2,1) both;position:relative}
@keyframes glogo{from{opacity:0;transform:translateY(-10px);filter:blur(6px)}}
.g-kick{animation:gkick 1.2s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes gkick{from{opacity:0;letter-spacing:.6em}}
.gate .g-p{animation:gpin .9s cubic-bezier(.2,.8,.2,1) .35s both}
.gate .g-p:nth-child(2){animation-delay:.5s}
.g-ring{box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04);animation:breathe 5s ease-in-out infinite}
.g-p:nth-child(2) .g-ring{animation-delay:-2.5s}
@keyframes breathe{50%{box-shadow:0 26px 60px rgba(0,0,0,.4),0 0 0 8px color-mix(in srgb,var(--accent) 6%,transparent),inset 0 0 0 1px rgba(255,255,255,.06)}}
.g-halo{position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--accent) 55%,transparent) 85%,transparent 100%);opacity:.5;animation:spin 7s linear infinite;-webkit-mask:radial-gradient(circle,transparent calc(50% - 3px),#000 calc(50% - 2px));mask:radial-gradient(circle,transparent calc(50% - 3px),#000 calc(50% - 2px))}
.g-sil{animation:silfloat 6s ease-in-out infinite}
@keyframes silfloat{50%{transform:translateY(-1.5%) scale(1.01)}}
.g-glass{animation:glassglow 3.6s ease-in-out infinite}
@keyframes glassglow{50%{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 95%,transparent))}}
.g-photo{clip-path:circle(0% at 50% 50%);opacity:1;transform:scale(1.14);transition:clip-path 1s cubic-bezier(.2,.8,.2,1),transform 1.4s cubic-bezier(.2,.8,.2,1),filter 1s}
.g-scan{position:absolute;left:-10%;right:-10%;top:-12%;height:12%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 80%,#fff) 50%,transparent);opacity:0;filter:blur(2px);pointer-events:none}
.g-flare{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,color-mix(in srgb,var(--accent) 60%,#fff) 25%,transparent 60%);opacity:0;transform:scale(.2);pointer-events:none;mix-blend-mode:screen}
.g-sparks{position:absolute;inset:0;pointer-events:none}

/* indicatore liquido: due gocce con molle diverse (davanti più rigida, dietro più morbida);
   il filtro "goo" le fonde, così la pillola si stira e si ricompatta come un fluido */
var Goo = { a: { x: null, v: 0 }, b: { x: null, v: 0 }, target: null, w: 0, run: false, show: false };

  var nr = nav.getBoundingClientRect(), r = on.getBoundingClientRect();

}
function stepGoo(now) {

  [[Goo.a, 300, 25], [Goo.b, 120, 16.5]].forEach(function (s) { var f = -s[1] * (s[0].x - Goo.target) - s[2] * s[0].v; s[0].v += f * dt; s[0].x += s[0].v * dt; });

  b.style.transform = 'translateX(' + Goo.b.x + 'px) scale(' + (1 - sq * .4) + ',' + (1 - sq * .5) + ')';

function monthCalc(mk) {

  var c = { inc: 0, exp: 0, paid: { gabriele: 0, valerio: 0, comune: 0 }, recv: { gabriele: 0, valerio: 0, comune: 0 }, shareExp: { gabriele: 0, valerio: 0 }, shareInc: { gabriele: 0, valerio: 0 }, refund: { gabriele: 0, valerio: 0 }, bal: { gabriele: 0, valerio: 0 } };
  es.forEach(function (e) {

  });

}

function openPhaseEditor(work) {
  var list = work || phases().map(function (p) { return JSON.parse(JSON.stringify(p)); });
  function subsText(p) { return p.subs.map(function (s) { return s.label + (s.only === 'graded' ? ' (solo graded)' : s.only === 'single' ? ' (solo singole)' : ''); }).join('\n'); }

      '<button type="button" class="mini" data-sact="up" data-i="' + i + '" aria-label="Su"' + (i ? '' : ' disabled') + '>↑</button><button type="button" class="mini" data-sact="rm" data-i="' + i + '" aria-label="Elimina fase">×</button></div>' +
      (p.auto ? '<p class="note">Segue lo stato Shopify (attivo = Sì).</p>' : '<div class="f"><label>Sottofasi, una per riga</label><textarea name="ps_' + i + '" rows="2" placeholder="Es. File di stampa">' + esc(subsText(p)) + '</textarea><small>Aggiungi “(solo graded)” o “(solo singole)” alla fine della riga se serve.</small></div>') +
      '<div class="f"><span class="l">Dipende da</span><div class="opts-check">' + (others.length ? others.map(function (q) { return '<label><input type="checkbox" name="pp_' + i + '" value="' + esc(q.k) + '"' + (p.pre.indexOf(q.k) >= 0 ? ' checked' : '') + '>' + esc(q.label) + '</label>'; }).join('') : '') + '</div><small>Se una di queste è “No”, questa fase resta bloccata. Nessuna spunta = fase libera.</small></div>' +
      '<div class="row2"><div class="f"><label>Vale per</label><select name="pa_' + i + '">' + opt([['', 'Singole e graded'], ['single', 'Solo singole'], ['graded', 'Solo graded']], p.only) + '</select></div><div class="f"><label>Anche sui bundle</label><select name="pb_' + i + '">' + opt([['1', 'Sì'], ['0', 'No']], p.bundle ? '1' : '0') + '</select></div></div></div>';
  }).join('');
  function sync(form) {
    list.forEach(function (p, i) {
      if (form['pl_' + i]) p.label = form['pl_' + i].value.trim() || p.label;
      if (form['ps_' + i]) p.subs = form['ps_' + i].value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
        var only = /\(solo graded\)\s*$/i.test(l) ? 'graded' : /\(solo singole\)\s*$/i.test(l) ? 'single' : '';
        var lab = l.replace(/\((solo graded|solo singole)\)\s*$/i, '').trim();
        var prev = p.subs.filter(function (s) { return s.label === lab; })[0];
        return { k: prev ? prev.k : (slug(lab) || 'sub').replace(/-/g, '_'), label: lab, only: only, auto: prev ? prev.auto || '' : '' };
      });
      p.pre = Array.prototype.slice.call(form.querySelectorAll('input[name="pp_' + i + '"]:checked')).map(function (x) { return x.value; });
      if (form['pa_' + i]) p.only = form['pa_' + i].value;
      if (form['pb_' + i]) p.bundle = form['pb_' + i].value === '1';
    });
  }
  openSheet({
    title: 'Fasi dei prodotti', sub: 'Valgono per tutto il catalogo. Gli stati già segnati restano.',
    body: body + '<button type="button" class="add" data-sact="add">' + I.plus + 'Fase</button>',
    onAction: function (act, el, form) {
      sync(form);
      var i = +el.getAttribute('data-i');
      if (act === 'up' && i > 0) { var t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; }
      if (act === 'rm') { var gone = list[i].k; list.splice(i, 1); list.forEach(function (p) { p.pre = p.pre.filter(function (k) { return k !== gone; }); }); }
      if (act === 'add') { var nk = 'fase-' + Date.now().toString(36).slice(-4); list.push({ k: nk, label: 'Nuova fase', d: '', dg: '', db: '', only: '', bundle: false, who: 'basket', auto: '', pre: [], subs: [] }); }
      closeSheet(true); openPhaseEditor(list);
    },
    submit: function (fd, form) {
      sync(form);
      window._fbSet('config/phases', list.map(function (p) { return { k: p.k, label: p.label, d: p.d || '', dg: p.dg || '', db: p.db || '', only: p.only || '', bundle: !!p.bundle, who: p.who || 'basket', auto: p.auto || '', count: !!p.count, pre: p.pre, subs: p.subs }; }));
      logActivity('config', 'phases', 'modifica fasi', [], list.map(function (p) { return p.label; }).join(' · '));
      toast('Fasi salvate');
    }
  });
}

/* ---------- media di un contenuto: foto o video, con miniatura ---------- */
function prepareMedia(file, cb) {
  var isVid = /^video\//.test(file.type), isImg = /^image\//.test(file.type);
  if (!isVid && !isImg) { toast('Carica una foto o un video'); return; }
  if (isVid && file.size > 40 * 1024 * 1024) { toast('Video troppo grande (max 40 MB): esporta una versione più leggera'); return; }
  if (isImg) return prepareAttachment(file, function (f) { f.kind = 'image'; cb(f); });
  if (file.size > 15 * 1024 * 1024) toast('Video grande: il caricamento può volerci un po’');
  var url = URL.createObjectURL(file), v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  var done = false;
  function finish(thumb, w, h, dur) {
    if (done) return; done = true;
    var rd = new FileReader();
    rd.onload = function () { URL.revokeObjectURL(url); cb({ name: file.name, type: file.type, size: file.size, thumb: thumb, data: rd.result, kind: 'video', w: w, h: h, dur: dur }); };
    rd.readAsDataURL(file);
  }
  v.addEventListener('loadeddata', function () { try { v.currentTime = Math.min(0.6, (v.duration || 1) / 3); } catch (e) { finish('', v.videoWidth, v.videoHeight, v.duration); } });
  v.addEventListener('seeked', function () {
    try { var k = Math.min(1, 260 / Math.max(v.videoWidth, v.videoHeight)), cv = document.createElement('canvas'); cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k); cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height); finish(cv.toDataURL('image/jpeg', .72), v.videoWidth, v.videoHeight, v.duration); }
    catch (e) { finish('', v.videoWidth, v.videoHeight, v.duration); }
  });
  v.addEventListener('error', function () { toast('Video non leggibile dal browser (prova un MP4 H.264)'); });
  setTimeout(function () { if (!done) finish('', 0, 0, 0); }, 8000);
}

  if (top + h > H - 10) { top = Math.max(10, (o.above ? y : y - h - 6)); ox = ox.split(' ')[0] + ' 100%'; }
  if (left < 10) left = 10; if (top < 10) top = 10;
  pop.style.left = left + 'px'; pop.style.top = top + 'px'; pop.style.transformOrigin = ox;

    return '<button class="' + (it.on ? 'on' : '') + '" data-act="side-sub" data-v="' + esc(sec + ':' + it.k) + '" title="' + esc(it.label) + '"><i class="sub-i">' + subIcon(sec, it.k) + '</i><span>' + esc(it.label) + '</span>' + (it.n != null ? '<em class="n">' + it.n + '</em>' : '') + '</button>';
  }).join('');
}
function sideSub(v) {
  var i = v.indexOf(':'), sec = v.slice(0, i), k = v.slice(i + 1);
  function after(fn) { setTimeout(fn, 60); setTimeout(fn, 420); }
  if (sec === 'tasks') {
    app.lane = k; lsSet('hq-lane', k); go('task');
    after(function () { var el = document.querySelector('.lane[data-drop="' + k + '"]'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
  } else if (sec === 'catalog') { app.c.tab = k; app.c.sel = {}; go('catalogo'); }
  else if (sec === 'channels') go('canale-' + k);
  else if (sec === 'releases') { app.r.view = k; go('uscite'); }
  else if (sec === 'ideas') { app.i.mode = k; go('idee'); }
  else if (sec === 'finance') { app.f.tab = k; go('finanze'); }
  else if (sec === 'dash') {
    go('dashboard');
    after(function () {
      var hit = null; document.querySelectorAll('main .block').forEach(function (b) { var t = b.querySelector('.block-t'); if (!hit && t && t.textContent.trim() === k) hit = b; });
      if (hit) { hit.scrollIntoView({ behavior: 'smooth', block: 'start' }); hit.classList.remove('flash'); void hit.offsetWidth; hit.classList.add('flash'); }
    });
  }
}
function sideMeHtml() {
  var pr = person(app.actor);
  return avatar(app.actor, 38) + '<span class="me-tx"><strong>' + esc(pr.name) + '</strong><small>' + esc(pr.title ? pr.title + (pr.titleLong ? ' · ' + pr.titleLong : '') : 'Profilo') + '</small></span><i class="me-dots">' + I.more + '</i>';
}
function updateSide() {
  var side = document.getElementById('side'); if (!side) return;
  var me = side.querySelector('.side-me'); if (me) { var mh = sideMeHtml(); if (me.innerHTML !== mh) me.innerHTML = mh; }
  var cur = sideCur(), bd = sideBadges(), onBtn = null;
  side.querySelectorAll('[data-side]').forEach(function (b) {
    var k = b.getAttribute('data-side'), on = k === cur; b.classList.toggle('on', on); if (on) onBtn = b;
    var bg = b.querySelector('.side-badge'), v = bd[k]; if (v) { bg.textContent = v.n; bg.className = 'side-badge ' + v.cls; bg.hidden = false; } else bg.hidden = true;
    var sub = b.parentNode.querySelector('.side-sub'); if (sub) { var h = on ? sideSubHtml(k) : ''; if (sub.innerHTML !== h) sub.innerHTML = h; sub.classList.toggle('open', !!h); }
  });
  var ind = side.querySelector('.side-ind');
  if (onBtn && ind) { ind.style.transform = 'translateY(' + onBtn.offsetTop + 'px)'; ind.style.height = onBtn.offsetHeight + 'px'; ind.style.opacity = 1; } else if (ind) ind.style.opacity = 0;
}
function toggleSide() {
  var side = document.getElementById('side'); if (!side) return;
  var col = !side.classList.contains('col');
  side.classList.toggle('col', col); document.documentElement.classList.toggle('side-col', col); lsSet('hq-side', col ? 'closed' : 'open');

(function () {

/* ================= TASK DA TELEFONO: corsie a scorrimento + sposta con pressione lunga ================= */
function laneScroll(l, smooth) {
  var boards = document.querySelectorAll('.board'); if (!boards.length) return false;
  var i = LANES.indexOf(l); if (i < 0) return false;
  app.lane = l; lsSet('hq-lane', l);
  boards.forEach(function (b) {
    var lane = b.children[i]; if (!lane) return;
    b.scrollTo({ left: lane.offsetLeft - (b.clientWidth - lane.clientWidth) / 2, behavior: smooth ? 'smooth' : 'auto' });
  });
  markTabs(l); return true;
}
function markTabs(l) {
  document.querySelectorAll('.tabs .tab[data-v]').forEach(function (t) { var on = t.getAttribute('data-v') === l; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
  document.querySelectorAll('.board .lane').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-drop') === l); });
}
function syncBoards() {
  if (window.innerWidth >= 900) return;
  document.querySelectorAll('.board').forEach(function (b) {
    if (!b._hq) {
      b._hq = true; var tm = null;
      b.addEventListener('scroll', function () {
        clearTimeout(tm);
        tm = setTimeout(function () {
          var mid = b.scrollLeft + b.clientWidth / 2, best = 0, bd = 1e9;
          Array.prototype.forEach.call(b.children, function (c, i) { var d = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
          var l = LANES[best]; if (l && l !== app.lane) { app.lane = l; lsSet('hq-lane', l); markTabs(l); }
        }, 90);
      }, { passive: true });
    }
  });
  laneScroll(app.lane, false);
}
window.addEventListener('resize', function () { if (window.innerWidth < 900) laneScroll(app.lane, false); });
